[workspace]
members = [
    "input-capture",
    "input-emulation",
    "input-event",
    "lan-mouse-ipc",
    "lan-mouse-cli",
    "lan-mouse-proto",
    "vylo-app/src-tauri",
]

[package]
name = "vylo-mouse-share"
description = "Vylo Mouse Share — mouse, keyboard, clipboard and file sharing between two machines on a LAN"
version = "1.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/AvrazAkraye/vylo-mouse-share"

[lib]
name = "vylo_mouse_share"
path = "src/lib.rs"

[[bin]]
name = "vylo"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"

[build-dependencies]
shadow-rs = "1.2.0"

[dependencies]
input-event = { path = "input-event", version = "0.4.0" }
input-emulation = { path = "input-emulation", version = "0.4.0", default-features = false }
input-capture = { path = "input-capture", version = "0.4.0", default-features = false }
lan-mouse-cli = { path = "lan-mouse-cli", version = "0.3.0" }
lan-mouse-ipc = { path = "lan-mouse-ipc", version = "0.3.0" }
lan-mouse-proto = { path = "lan-mouse-proto", version = "0.3.0" }
shadow-rs = { version = "1.2.0", features = ["metadata"] }

toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.20"
env_logger = "0.11.3"
serde_json = "1.0.107"
tokio = { version = "1.32.0", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "signal",
] }
futures = "0.3.28"
clap = { version = "4.4.11", features = ["derive"] }
slab = "0.4.9"
thiserror = "2.0.0"
tokio-util = "0.7.11"
local-channel = "0.1.5"
webrtc-dtls = { version = "0.12.0", features = ["pem"] }
webrtc-util = "0.11.0"
rustls = { version = "0.23.12", default-features = false, features = [
    "std",
    "ring",
] }
rcgen = "0.13.1"
sha2 = "0.10.8"
notify = "8.2.0"

# vylo sync channel (clipboard + file transfer + pairing + discovery)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
bincode = "1.3"
spake2 = "0.4"
hmac = "0.12"
rand = "0.8"
arboard = { version = "3.4", default-features = false, features = ["image-data"] }
png = "0.17"
mdns-sd = "0.13"
dirs = "6"
gethostname = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.148"

# keyboard-layout sync: read/select the input source (Carbon TIS is
# linked directly; see src/sync/keyboard.rs)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.0"
core-foundation-sys = "0.8.6"

# keyboard-layout sync: read/activate the active keyboard layout
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_TextServices",
] }

[features]
default = [
    "layer_shell_capture",
    "x11_capture",
    "libei_capture",
    "wlroots_emulation",
    "libei_emulation",
    "rdp_emulation",
    "x11_emulation",
]
layer_shell_capture = ["input-capture/layer_shell"]
x11_capture = ["input-capture/x11"]
libei_capture = ["input-event/libei", "input-capture/libei"]
libei_emulation = ["input-event/libei", "input-emulation/libei"]
wlroots_emulation = ["input-emulation/wlroots"]
x11_emulation = ["input-emulation/x11"]
rdp_emulation = ["input-emulation/remote_desktop_portal"]
