name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Daemon tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features

  bundle:
    name: App bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            # `app` is what the in-app updater ships (.app.tar.gz + .sig);
            # `dmg` is the human-facing installer
            bundles: app,dmg
            artifact: vylo-macos-arm64
            # vylo-app is a workspace member, so Tauri bundles land in
            # the workspace-root target/, not vylo-app/src-tauri/target/
            path: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app.tar.gz
              target/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            # the NSIS installer doubles as the updater artifact on Windows
            bundles: nsis
            artifact: vylo-windows-x64
            path: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: vylo-app
        run: npm ci
      - name: Build app
        working-directory: vylo-app
        env:
          # minisign key for updater signatures; the app only installs
          # updates whose .sig verifies against plugins.updater.pubkey
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Normalize asset names
        # GitHub rewrites spaces in asset names to dots, which would break
        # the URLs in latest.json; use stable dash-separated names instead
        # and stamp version/arch on the macOS updater bundle.
        working-directory: artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # upload-artifact keeps subdirectories when a matrix entry spans
          # several bundle dirs (macos/, dmg/); flatten before renaming
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          if [ -f "Vylo Mouse Share.app.tar.gz" ]; then
            mv "Vylo Mouse Share.app.tar.gz"     "Vylo-Mouse-Share_${VERSION}_aarch64.app.tar.gz"
            mv "Vylo Mouse Share.app.tar.gz.sig" "Vylo-Mouse-Share_${VERSION}_aarch64.app.tar.gz.sig"
          fi
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /-}"; done
          ls -la
      - name: Write updater manifest (latest.json)
        working-directory: artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          python3 - "$VERSION" "$BASE" <<'PY'
          import json, os, sys, datetime
          version, base = sys.argv[1], sys.argv[2]
          targets = {
              "darwin-aarch64": f"Vylo-Mouse-Share_{version}_aarch64.app.tar.gz",
              "windows-x86_64": f"Vylo-Mouse-Share_{version}_x64-setup.exe",
          }
          platforms = {}
          for key, name in targets.items():
              sig = name + ".sig"
              if not (os.path.exists(name) and os.path.exists(sig)):
                  # a manifest missing a platform would strand that platform
                  # on the old version forever; fail the release instead
                  sys.exit(f"missing updater artifact for {key}: {name} (+ .sig)")
              platforms[key] = {
                  "signature": open(sig, encoding="utf-8").read().strip(),
                  "url": f"{base}/{name}",
              }
          manifest = {
              "version": version,
              "notes": f"Vylo Mouse Share {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: false
          generate_release_notes: true
